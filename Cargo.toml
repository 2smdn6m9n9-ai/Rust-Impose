[package]
name = "rust-impose"
version = "0.1.2"
edition = "2024"
authors = ["Rust Impose"]
description = "Native PDF imposition tool for Apple Silicon"

[[bin]]
name = "RustImpose"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "x11", "wayland", "default_fonts"] }
lopdf = { version = "0.45.0", default-features = false, features = ["rayon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.17.1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
